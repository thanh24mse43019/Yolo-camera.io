<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>YOLO Vision — Real-time Detection</title>
<link href="https://fonts.googleapis.com/css2?family=Syne+Mono&family=Syne:wght@400;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #090c10;
    --panel: #0e1318;
    --border: #1e2a36;
    --accent: #00f5a0;
    --accent2: #00b4d8;
    --warn: #ff6b35;
    --text: #c8d8e8;
    --muted: #4a6070;
    --card: #111820;
    --glow: 0 0 20px rgba(0,245,160,0.15);
  }
 
  * { box-sizing: border-box; margin: 0; padding: 0; }
 
  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Syne', sans-serif;
    min-height: 100vh;
    overflow-x: hidden;
  }
 
  /* Grid noise overlay */
  body::before {
    content: '';
    position: fixed; inset: 0;
    background-image:
      linear-gradient(rgba(0,245,160,0.02) 1px, transparent 1px),
      linear-gradient(90deg, rgba(0,245,160,0.02) 1px, transparent 1px);
    background-size: 40px 40px;
    pointer-events: none;
    z-index: 0;
  }
 
  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 18px 32px;
    border-bottom: 1px solid var(--border);
    position: relative;
    z-index: 10;
    backdrop-filter: blur(6px);
  }
 
  .logo {
    font-size: 1.3rem;
    font-weight: 800;
    letter-spacing: -0.02em;
    color: #fff;
  }
  .logo span { color: var(--accent); }
 
  .status-bar {
    display: flex;
    align-items: center;
    gap: 8px;
    font-family: 'Syne Mono', monospace;
    font-size: 0.75rem;
    color: var(--muted);
  }
  .dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    background: var(--muted);
    transition: background 0.3s, box-shadow 0.3s;
  }
  .dot.live { background: var(--accent); box-shadow: 0 0 8px var(--accent); }
  .dot.error { background: var(--warn); box-shadow: 0 0 8px var(--warn); }
 
  .main {
    display: grid;
    grid-template-columns: 1fr 320px;
    gap: 0;
    height: calc(100vh - 61px);
    position: relative;
    z-index: 1;
  }
 
  /* ── Video Panel ── */
  .video-panel {
    position: relative;
    background: #000;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }
 
  #videoEl {
    width: 100%; height: 100%;
    object-fit: contain;
    display: none;
  }
 
  #canvasOverlay {
    position: absolute; inset: 0;
    pointer-events: none;
  }
 
  .video-placeholder {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 16px;
    color: var(--muted);
  }
  .video-placeholder svg { opacity: 0.3; }
  .video-placeholder p { font-size: 0.9rem; }
 
  /* Corner brackets */
  .corner {
    position: absolute;
    width: 28px; height: 28px;
    border-color: var(--accent);
    border-style: solid;
    opacity: 0.5;
  }
  .corner.tl { top: 16px; left: 16px; border-width: 2px 0 0 2px; }
  .corner.tr { top: 16px; right: 16px; border-width: 2px 2px 0 0; }
  .corner.bl { bottom: 16px; left: 16px; border-width: 0 0 2px 2px; }
  .corner.br { bottom: 16px; right: 16px; border-width: 0 2px 2px 0; }
 
  /* Scan line animation */
  .scanline {
    position: absolute;
    left: 0; right: 0;
    height: 2px;
    background: linear-gradient(90deg, transparent, var(--accent), transparent);
    opacity: 0;
    pointer-events: none;
    animation: scan 3s ease-in-out infinite;
  }
  @keyframes scan {
    0%   { top: 0%;  opacity: 0; }
    10%  { opacity: 0.4; }
    90%  { opacity: 0.4; }
    100% { top: 100%; opacity: 0; }
  }
 
  /* ── Sidebar ── */
  .sidebar {
    background: var(--panel);
    border-left: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    overflow-y: auto;
  }
 
  .sidebar-section {
    padding: 20px;
    border-bottom: 1px solid var(--border);
  }
 
  .section-label {
    font-size: 0.65rem;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 14px;
    font-family: 'Syne Mono', monospace;
  }
 
  /* ── Metrics Grid ── */
  .metrics-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
  }
 
  .metric-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 12px;
    position: relative;
    overflow: hidden;
    transition: border-color 0.3s;
  }
  .metric-card::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 2px;
    background: var(--accent);
    transform: scaleX(0);
    transform-origin: left;
    transition: transform 0.4s ease;
  }
  .metric-card.updated::before { transform: scaleX(1); }
 
  .metric-label {
    font-size: 0.6rem;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--muted);
    font-family: 'Syne Mono', monospace;
    margin-bottom: 6px;
  }
  .metric-value {
    font-size: 1.4rem;
    font-weight: 800;
    color: var(--accent);
    line-height: 1;
    font-family: 'Syne Mono', monospace;
    transition: color 0.3s;
  }
  .metric-unit {
    font-size: 0.65rem;
    color: var(--muted);
    margin-top: 2px;
    font-family: 'Syne Mono', monospace;
  }
 
  /* FPS color thresholds */
  .metric-value.good  { color: var(--accent); }
  .metric-value.mid   { color: #f0c040; }
  .metric-value.bad   { color: var(--warn); }
 
  /* ── FPS Sparkline ── */
  #sparkline {
    width: 100%;
    height: 48px;
    margin-top: 8px;
  }
 
  /* ── Detection Log ── */
  .detection-list {
    display: flex;
    flex-direction: column;
    gap: 6px;
    max-height: 220px;
    overflow-y: auto;
  }
  .detection-list::-webkit-scrollbar { width: 4px; }
  .detection-list::-webkit-scrollbar-track { background: transparent; }
  .detection-list::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }
 
  .det-item {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 8px 10px;
    background: var(--card);
    border-radius: 6px;
    border: 1px solid var(--border);
    font-size: 0.8rem;
    animation: fadeIn 0.2s ease;
  }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(-4px); } to { opacity: 1; transform: none; } }
 
  .det-label { color: #fff; font-weight: 700; }
  .det-conf {
    font-family: 'Syne Mono', monospace;
    font-size: 0.72rem;
    color: var(--accent);
  }
  .det-count {
    background: var(--accent);
    color: #000;
    font-size: 0.6rem;
    font-weight: 800;
    padding: 2px 6px;
    border-radius: 20px;
    margin-left: 6px;
  }
 
  .no-detections {
    color: var(--muted);
    font-size: 0.8rem;
    font-family: 'Syne Mono', monospace;
    padding: 12px 0;
    text-align: center;
  }
 
  /* ── Model Info ── */
  .model-info {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .info-row {
    display: flex;
    justify-content: space-between;
    font-size: 0.78rem;
  }
  .info-key { color: var(--muted); font-family: 'Syne Mono', monospace; font-size: 0.7rem; }
  .info-val { color: var(--text); font-weight: 700; }
 
  /* ── Controls ── */
  .controls {
    display: flex;
    flex-direction: column;
    gap: 10px;
    padding: 20px;
  }
 
  .server-input-row {
    display: flex;
    gap: 8px;
  }
 
  input[type="text"] {
    flex: 1;
    background: var(--card);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 10px 12px;
    border-radius: 6px;
    font-family: 'Syne Mono', monospace;
    font-size: 0.75rem;
    outline: none;
    transition: border-color 0.2s;
  }
  input[type="text"]:focus { border-color: var(--accent); }
 
  label.ctrl-label {
    font-size: 0.65rem;
    color: var(--muted);
    letter-spacing: 0.1em;
    text-transform: uppercase;
    font-family: 'Syne Mono', monospace;
    margin-bottom: 4px;
    display: block;
  }
 
  button {
    width: 100%;
    padding: 12px;
    border: none;
    border-radius: 6px;
    font-family: 'Syne', sans-serif;
    font-weight: 800;
    font-size: 0.85rem;
    letter-spacing: 0.06em;
    cursor: pointer;
    transition: all 0.2s;
    position: relative;
    overflow: hidden;
  }
  .btn-primary {
    background: var(--accent);
    color: #000;
  }
  .btn-primary:hover { background: #00e090; box-shadow: 0 0 20px rgba(0,245,160,0.35); }
  .btn-secondary {
    background: transparent;
    color: var(--warn);
    border: 1px solid var(--warn);
  }
  .btn-secondary:hover { background: rgba(255,107,53,0.1); }
  .btn-secondary:disabled { opacity: 0.3; cursor: not-allowed; }
 
  /* Confidence slider */
  input[type="range"] {
    -webkit-appearance: none;
    width: 100%;
    height: 4px;
    background: var(--border);
    border-radius: 2px;
    outline: none;
    margin: 6px 0;
  }
  input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 14px; height: 14px;
    border-radius: 50%;
    background: var(--accent);
    cursor: pointer;
    box-shadow: 0 0 6px var(--accent);
  }
 
  .slider-row {
    display: flex;
    justify-content: space-between;
    font-size: 0.7rem;
    color: var(--muted);
    font-family: 'Syne Mono', monospace;
    margin-top: 2px;
  }
 
  /* Error toast */
  #errorToast {
    position: fixed;
    bottom: 24px; left: 50%;
    transform: translateX(-50%) translateY(80px);
    background: var(--warn);
    color: #fff;
    padding: 10px 20px;
    border-radius: 6px;
    font-size: 0.8rem;
    font-family: 'Syne Mono', monospace;
    z-index: 100;
    transition: transform 0.3s ease;
    pointer-events: none;
  }
  #errorToast.show { transform: translateX(-50%) translateY(0); }
 
  /* Log section */
  #logBox {
    font-family: 'Syne Mono', monospace;
    font-size: 0.68rem;
    color: var(--muted);
    line-height: 1.7;
    max-height: 120px;
    overflow-y: auto;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 10px;
  }
  #logBox::-webkit-scrollbar { width: 3px; }
  #logBox::-webkit-scrollbar-thumb { background: var(--border); }
  .log-ok  { color: var(--accent); }
  .log-err { color: var(--warn); }
  .log-info { color: var(--accent2); }
 
  @media (max-width: 900px) {
    .main { grid-template-columns: 1fr; grid-template-rows: 50vh 1fr; }
    .sidebar { border-left: none; border-top: 1px solid var(--border); }
  }
</style>
</head>
<body>
 
<header>
  <div class="logo">YOLO<span>Vision</span></div>
  <div class="status-bar">
    <div class="dot" id="connDot"></div>
    <span id="connLabel">DISCONNECTED</span>
  </div>
</header>
 
<div class="main">
 
  <!-- Video Panel -->
  <div class="video-panel" id="videoPanel">
    <div class="corner tl"></div>
    <div class="corner tr"></div>
    <div class="corner bl"></div>
    <div class="corner br"></div>
    <div class="scanline" id="scanline"></div>
 
    <video id="videoEl" autoplay muted playsinline></video>
    <canvas id="canvasOverlay"></canvas>
 
    <div class="video-placeholder" id="placeholder">
      <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1">
        <rect x="2" y="5" width="20" height="14" rx="2"/>
        <circle cx="12" cy="12" r="3"/>
        <path d="M17 5l2-2M7 5L5 3"/>
      </svg>
      <p>Start camera to begin detection</p>
    </div>
  </div>
 
  <!-- Sidebar -->
  <div class="sidebar">
 
    <!-- Metrics -->
    <div class="sidebar-section">
      <div class="section-label">Performance</div>
      <div class="metrics-grid">
        <div class="metric-card" id="fpsMC">
          <div class="metric-label">FPS</div>
          <div class="metric-value good" id="fpsVal">—</div>
          <div class="metric-unit">frames/sec</div>
        </div>
        <div class="metric-card" id="msMC">
          <div class="metric-label">Latency</div>
          <div class="metric-value" id="msVal">—</div>
          <div class="metric-unit">ms round-trip</div>
        </div>
        <div class="metric-card" id="gflopsMC">
          <div class="metric-label">Model GFLOPs</div>
          <div class="metric-value" id="gflopsVal">—</div>
          <div class="metric-unit">GFLOPs</div>
        </div>
        <div class="metric-card" id="countMC">
          <div class="metric-label">Objects</div>
          <div class="metric-value" id="countVal">0</div>
          <div class="metric-unit">detected</div>
        </div>
      </div>
      <svg id="sparkline" xmlns="http://www.w3.org/2000/svg">
        <polyline id="sparkPoly" fill="none" stroke="#00f5a0" stroke-width="1.5" opacity="0.6"/>
        <line x1="0" y1="32" x2="9999" y2="32" stroke="#1e2a36" stroke-width="1"/>
      </svg>
    </div>
 
    <!-- Detections -->
    <div class="sidebar-section">
      <div class="section-label">Detections</div>
      <div class="detection-list" id="detectionList">
        <div class="no-detections">Awaiting inference…</div>
      </div>
    </div>
 
    <!-- Model Info -->
    <div class="sidebar-section">
      <div class="section-label">Model</div>
      <div class="model-info" id="modelInfo">
        <div class="info-row">
          <span class="info-key">name</span>
          <span class="info-val" id="mName">—</span>
        </div>
        <div class="info-row">
          <span class="info-key">params</span>
          <span class="info-val" id="mParams">—</span>
        </div>
        <div class="info-row">
          <span class="info-key">device</span>
          <span class="info-val" id="mDevice">—</span>
        </div>
        <div class="info-row">
          <span class="info-key">input size</span>
          <span class="info-val" id="mImgsz">—</span>
        </div>
      </div>
    </div>
 
    <!-- Controls -->
    <div class="controls">
      <div>
        <label class="ctrl-label">Backend Server URL</label>
        <input type="text" id="serverUrl" value="https://uncombed-napped-placate.ngrok-free.dev" placeholder=" https://uncombed-napped-placate.ngrok-free.dev"/>
      </div>
      <div>
        <label class="ctrl-label">Confidence threshold: <span id="confDisp">0.40</span></label>
        <input type="range" id="confSlider" min="0.1" max="0.95" step="0.05" value="0.40"/>
        <div class="slider-row"><span>0.1</span><span>0.95</span></div>
      </div>
      <button class="btn-primary" id="startBtn" onclick="startCamera()">▶ Start Camera</button>
      <button class="btn-secondary" id="stopBtn" onclick="stopCamera()" disabled>■ Stop</button>
    </div>
 
    <!-- Log -->
    <div class="sidebar-section" style="flex:1">
      <div class="section-label">Log</div>
      <div id="logBox"><span class="log-info">Ready. Set server URL and start camera.</span></div>
    </div>
 
  </div>
</div>
 
<div id="errorToast">Error message</div>
 
<script>
// ─────────────────────────── State ───────────────────────────
let stream = null;
let running = false;
let animId = null;
let fpsHistory = [];
let lastFrameTime = 0;
let frameCount = 0;
let fpsAccum = 0;
let lastFpsUpdate = 0;
const FPS_SAMPLES = 60;
const SPARKLINE_POINTS = 50;
const sparkData = new Array(SPARKLINE_POINTS).fill(0);
let confidence = 0.40;
let gflopsCache = null;
 
const video = document.getElementById('videoEl');
const canvas = document.getElementById('canvasOverlay');
const ctx = canvas.getContext('2d');
const placeholder = document.getElementById('placeholder');
 
// ─────────────────────────── Log ───────────────────────────
function log(msg, cls='') {
  const box = document.getElementById('logBox');
  const ts = new Date().toLocaleTimeString('en',{hour12:false});
  box.innerHTML += `<br><span class="${cls}">[${ts}] ${msg}</span>`;
  box.scrollTop = box.scrollHeight;
}
 
// ─────────────────────────── Toast ───────────────────────────
function showToast(msg) {
  const t = document.getElementById('errorToast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), 3000);
}
 
// ─────────────────────────── Connection Indicator ───────────────────────────
function setConn(state) {
  const dot = document.getElementById('connDot');
  const lbl = document.getElementById('connLabel');
  dot.className = 'dot ' + (state==='live' ? 'live' : state==='error' ? 'error' : '');
  lbl.textContent = state==='live' ? 'LIVE' : state==='error' ? 'ERROR' : 'DISCONNECTED';
}
 
// ─────────────────────────── Slider ───────────────────────────
document.getElementById('confSlider').addEventListener('input', e => {
  confidence = parseFloat(e.target.value);
  document.getElementById('confDisp').textContent = confidence.toFixed(2);
});
 
// ─────────────────────────── Camera ───────────────────────────
async function startCamera() {
  try {
    stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode:'environment', width:{ideal:1280}, height:{ideal:720} }
    });
    video.srcObject = stream;
    video.style.display = 'block';
    placeholder.style.display = 'none';
    document.getElementById('startBtn').disabled = true;
    document.getElementById('stopBtn').disabled = false;
    running = true;
    log('Camera started', 'log-ok');
 
    // Fetch model info once
    fetchModelInfo();
 
    video.onloadedmetadata = () => {
      resizeCanvas();
      loopFrame();
    };
  } catch(e) {
    log('Camera error: ' + e.message, 'log-err');
    showToast('Camera access denied');
  }
}
 
function stopCamera() {
  running = false;
  cancelAnimationFrame(animId);
  if (stream) stream.getTracks().forEach(t=>t.stop());
  video.style.display = 'none';
  placeholder.style.display = 'flex';
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  document.getElementById('startBtn').disabled = false;
  document.getElementById('stopBtn').disabled = true;
  setConn('');
  resetMetrics();
  log('Camera stopped');
}
 
function resizeCanvas() {
  canvas.width  = video.videoWidth;
  canvas.height = video.videoHeight;
  canvas.style.width  = '100%';
  canvas.style.height = '100%';
}
 
// ─────────────────────────── Frame Loop ───────────────────────────
// Send a frame every N ms to avoid flooding slow servers
const SEND_INTERVAL_MS = 80; // ~12.5 inference requests/sec max
let lastSendTime = 0;
let inFlight = false;
 
function loopFrame(ts = 0) {
  if (!running) return;
  animId = requestAnimationFrame(loopFrame);
 
  // FPS tracking (rendered frames)
  const now = performance.now();
  if (lastFrameTime) {
    const delta = now - lastFrameTime;
    fpsAccum++;
    if (now - lastFpsUpdate > 500) {
      const fps = fpsAccum / ((now - lastFpsUpdate) / 1000);
      updateFPS(fps);
      fpsAccum = 0;
      lastFpsUpdate = now;
    }
  }
  lastFrameTime = now;
 
  // Send frame to backend at throttled rate
  if (!inFlight && (now - lastSendTime) >= SEND_INTERVAL_MS) {
    lastSendTime = now;
    sendFrame(now);
  }
}
 
// ─────────────────────────── Send Frame ───────────────────────────
async function sendFrame(sentAt) {
  inFlight = true;
  const offscreen = document.createElement('canvas');
  offscreen.width  = 640;
  offscreen.height = 360;
  const oc = offscreen.getContext('2d');
  oc.drawImage(video, 0, 0, 640, 360);
  offscreen.toBlob(async blob => {
    const fd = new FormData();
    fd.append('frame', blob, 'frame.jpg');
    fd.append('conf', confidence);
    const url = document.getElementById('serverUrl').value.replace(/\/$/, '') + '/detect';
    try {
      const res = await fetch(url, { method:'POST', body:fd });
      if (!res.ok) throw new Error('HTTP ' + res.status);
      const data = await res.json();
      const ms = Math.round(performance.now() - sentAt);
      handleResult(data, ms);
      setConn('live');
    } catch(e) {
      setConn('error');
      log('Inference error: '+e.message, 'log-err');
    } finally {
      inFlight = false;
    }
  }, 'image/jpeg', 0.7);
}
 
// ─────────────────────────── Draw Results ───────────────────────────
const PALETTE = [
  '#00f5a0','#00b4d8','#ff6b35','#f72585','#7209b7',
  '#3a86ff','#fb5607','#8338ec','#06d6a0','#ffbe0b'
];
const classColors = {};
 
function handleResult(data, ms) {
  const dets = data.detections || [];
  ctx.clearRect(0, 0, canvas.width, canvas.height);
 
  // Scale boxes from 640×360 back to canvas size
  const scaleX = canvas.width / 640;
  const scaleY = canvas.height / 360;
 
  dets.forEach(d => {
    const [x1,y1,x2,y2] = d.box;
    if (!classColors[d.label]) {
      classColors[d.label] = PALETTE[Object.keys(classColors).length % PALETTE.length];
    }
    const color = classColors[d.label];
    const cx1=x1*scaleX, cy1=y1*scaleY, cw=(x2-x1)*scaleX, ch=(y2-y1)*scaleY;
 
    ctx.strokeStyle = color;
    ctx.lineWidth = 2;
    ctx.strokeRect(cx1, cy1, cw, ch);
 
    // Label pill
    const label = `${d.label} ${(d.confidence*100).toFixed(0)}%`;
    ctx.font = 'bold 12px Syne Mono, monospace';
    const tw = ctx.measureText(label).width;
    ctx.fillStyle = color;
    ctx.fillRect(cx1, cy1 - 22, tw + 10, 20);
    ctx.fillStyle = '#000';
    ctx.fillText(label, cx1 + 5, cy1 - 7);
  });
 
  updateDetectionList(dets);
  updateMetrics(ms, dets.length, data.model_gflops);
  if (data.model_info) updateModelInfo(data.model_info);
}
 
// ─────────────────────────── Metrics ───────────────────────────
function updateFPS(fps) {
  const el = document.getElementById('fpsVal');
  el.textContent = fps.toFixed(1);
  el.className = 'metric-value ' + (fps>20?'good':fps>10?'mid':'bad');
  // sparkline
  sparkData.shift();
  sparkData.push(fps);
  drawSparkline();
  flashCard('fpsMC');
}
 
function updateMetrics(ms, count, gflops) {
  document.getElementById('msVal').textContent = ms;
  document.getElementById('countVal').textContent = count;
  if (gflops !== undefined && gflops !== null) {
    document.getElementById('gflopsVal').textContent = parseFloat(gflops).toFixed(1);
    flashCard('gflopsMC');
  }
  flashCard('msMC');
  flashCard('countMC');
}
 
function updateModelInfo(info) {
  if (info.name)   document.getElementById('mName').textContent   = info.name;
  if (info.params) document.getElementById('mParams').textContent = info.params;
  if (info.device) document.getElementById('mDevice').textContent = info.device;
  if (info.imgsz)  document.getElementById('mImgsz').textContent  = info.imgsz;
}
 
function resetMetrics() {
  ['fpsVal','msVal','gflopsVal','countVal'].forEach(id=>document.getElementById(id).textContent='—');
  document.getElementById('countVal').textContent='0';
  sparkData.fill(0); drawSparkline();
}
 
function flashCard(id) {
  const el = document.getElementById(id);
  el.classList.remove('updated');
  void el.offsetWidth;
  el.classList.add('updated');
  setTimeout(()=>el.classList.remove('updated'), 400);
}
 
function drawSparkline() {
  const poly = document.getElementById('sparkPoly');
  const svgEl = document.getElementById('sparkline');
  const W = svgEl.clientWidth || 260;
  const H = 48;
  const max = Math.max(...sparkData, 30);
  const pts = sparkData.map((v,i) => {
    const x = (i / (SPARKLINE_POINTS-1)) * W;
    const y = H - (v / max) * (H - 4);
    return `${x},${y}`;
  }).join(' ');
  poly.setAttribute('points', pts);
}
 
// ─────────────────────────── Detection List ───────────────────────────
function updateDetectionList(dets) {
  const el = document.getElementById('detectionList');
  if (!dets.length) {
    el.innerHTML = '<div class="no-detections">No objects detected</div>';
    return;
  }
  // Aggregate by label
  const agg = {};
  dets.forEach(d => {
    if (!agg[d.label]) agg[d.label] = { count:0, maxConf:0 };
    agg[d.label].count++;
    agg[d.label].maxConf = Math.max(agg[d.label].maxConf, d.confidence);
  });
  el.innerHTML = Object.entries(agg)
    .sort((a,b)=>b[1].maxConf - a[1].maxConf)
    .map(([lbl,{count,maxConf}]) => `
      <div class="det-item">
        <span class="det-label">${lbl}${count>1?`<span class="det-count">${count}</span>`:''}</span>
        <span class="det-conf">${(maxConf*100).toFixed(1)}%</span>
      </div>`)
    .join('');
}
 
// ─────────────────────────── Model Info ───────────────────────────
async function fetchModelInfo() {
  const url = document.getElementById('serverUrl').value.replace(/\/$/, '') + '/model_info';
  try {
    const res = await fetch(url);
    if (!res.ok) return;
    const info = await res.json();
    updateModelInfo(info);
    if (info.gflops) document.getElementById('gflopsVal').textContent = parseFloat(info.gflops).toFixed(1);
    log('Model loaded: ' + (info.name||'unknown'), 'log-ok');
  } catch(e) {
    log('Could not fetch model info (server may need CORS)', 'log-err');
  }
}
 
// Resize canvas on window resize
window.addEventListener('resize', () => { if (running) resizeCanvas(); });
 
log('YOLOVision ready.', 'log-info');
</script>
