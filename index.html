<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>YOLOVision</title>

<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">

<h1>YOLOVision</h1>

<div class="topbar">

<input
id="serverUrl"
placeholder="https://your-ngrok-url.ngrok-free.app">

<button id="testBtn">
Test Connection
</button>

<button id="startBtn">
Start Camera
</button>

<button id="stopBtn" disabled>
Stop
</button>

</div>

<div class="stats">

<div>Model: <span id="modelName">-</span></div>
<div>Params: <span id="params">-</span></div>
<div>GFLOPs: <span id="gflops">-</span></div>
<div>Device: <span id="device">-</span></div>

<div>FPS: <span id="fps">0</span></div>
<div>Latency: <span id="latency">0</span> ms</div>

</div>

<div class="videoContainer">

<video
id="video"
autoplay
playsinline
muted>
</video>

<canvas id="overlay"></canvas>

</div>

<div id="status">
Disconnected
</div>

</div>

<script src="app.js"></script>

</body>
</html>
